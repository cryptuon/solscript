site_name: SolScript Documentation
site_description: A high-level language for Solana smart contract development
site_url: https://docs.cryptuon.com/solscript/
site_author: Cryptuon Research
repo_url: https://github.com/cryptuon/solscript
repo_name: cryptuon/solscript
edit_uri: edit/main/documentation/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  homepage: https://solscript.cryptuon.com/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cryptuon/solscript
    - icon: material/web
      link: https://solscript.cryptuon.com/
      name: SolScript site
    - icon: material/rocket-launch
      link: https://www.cryptuon.com
      name: Cryptuon Research
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/solscript

nav:
  - Home: index.md
  - Docs:
      - Getting Started:
          - Installation: guide/installation.md
          - Quick Start: guide/quickstart.md
          - Project Templates: guide/templates.md
          - Your First Contract: guide/first-contract.md
      - Language Guide:
          - Overview: guide/overview.md
          - Solana Concepts: guide/solana-concepts.md
          - Contracts: guide/contracts.md
          - Types: guide/types.md
          - Functions: guide/functions.md
          - State Variables: guide/state.md
          - Control Flow: guide/control-flow.md
          - Events & Errors: guide/events-errors.md
          - Modifiers: guide/modifiers.md
          - Interfaces: guide/interfaces.md
          - Inheritance: guide/inheritance.md
      - Tutorials:
          - Token Contract: tutorials/token.md
          - NFT Marketplace: tutorials/nft-marketplace.md
          - Escrow: tutorials/escrow.md
      - Examples:
          - Counter: examples/counter.md
          - Token: examples/token.md
          - Voting: examples/voting.md
      - IDE Support:
          - VS Code: ide/vscode.md
          - Language Server: ide/lsp.md
  - API Reference:
      - CLI Commands: reference/cli.md
      - Built-in Types: reference/types.md
      - Built-in Objects: reference/builtins.md
      - Attributes: reference/attributes.md
      - Grammar: reference/grammar.md
      - Roadmap: reference/roadmap.md

copyright: Copyright &copy; 2026 Cryptuon Research
