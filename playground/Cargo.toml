[workspace]
resolver = "2"
members = [
    "wasm",
    "backend",
]

[workspace.dependencies]
# SolScript compiler crates (from git)
solscript-ast = { git = "https://github.com/cryptuon/solscript", branch = "main" }
solscript-parser = { git = "https://github.com/cryptuon/solscript", branch = "main" }
solscript-typeck = { git = "https://github.com/cryptuon/solscript", branch = "main" }
solscript-codegen = { git = "https://github.com/cryptuon/solscript", branch = "main" }

# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
miette = { version = "7.0", default-features = false }
