[package]
name = "solscript-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for the SolScript compiler"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solscript-ast = { path = "../../crates/solscript-ast" }
solscript-parser = { path = "../../crates/solscript-parser" }
solscript-typeck = { path = "../../crates/solscript-typeck" }
solscript-codegen = { path = "../../crates/solscript-codegen" }

wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
miette = { version = "7.0", default-features = false }

[profile.release]
opt-level = "s"
lto = true
