[package]
name = "solscript-playground"
version = "0.1.0"
edition = "2021"
description = "Web backend for the SolScript Playground"

[[bin]]
name = "solscript-playground"
path = "src/main.rs"

[dependencies]
solscript-parser = { workspace = true }
solscript-typeck = { workspace = true }
solscript-codegen = { workspace = true }

axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
miette = { workspace = true }
